spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: room-service
              uri: lb://room-service
              predicates:
                - Path=/api/rooms/**
            - id: roomtype-service
              uri: lb://roomtype-service
              predicates:
                - Path=/api/roomtypes/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true